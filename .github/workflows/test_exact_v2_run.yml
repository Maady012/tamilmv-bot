name: Test V2 Runner
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import poll_worker
          d = poll_worker.get_active_domain()
          print('Domain:', d)
          items = poll_worker.scrape_discover_feed(d, set())
          print('Items count:', len(items))
          for t, l, tid in items[:5]:
              print('Item:', tid, t)
              dt = poll_worker.extract_post_details(l, fallback_title=t)
              print('  Details:', bool(dt), 'Magnets:', len(dt.get('magnets', [])) if dt else 0)
              if dt and dt.get('magnets'):
                  poll_worker.send_alert('${{ secrets.TELEGRAM_CHAT_ID }}', t, l, dt)
                  print('Sent alert!')
                  break
          "
