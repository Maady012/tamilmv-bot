name: Test Feed Filter
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          python3 -c "
          from curl_cffi import requests as cffi_requests
          from bs4 import BeautifulSoup
          import re
          from poll_worker import get_active_domain, clean_topic_url, extract_title_from_slug

          domain = get_active_domain()
          r = cffi_requests.get(f'{domain}/index.php?/discover/', impersonate='chrome120', timeout=15)
          soup = BeautifulSoup(r.text, 'html.parser')
          stream = soup.find('ol', class_='ipsStream') or soup

          discovered = {}
          for li in stream.find_all('li', class_='ipsStreamItem'):
              title_el = li.find('h2', class_='ipsStreamItem_title') or li.find('a', href=re.compile(r'/topic/'))
              if not title_el:
                  continue
              a_tag = title_el.find('a') if title_el.name != 'a' else title_el
              if not a_tag or not a_tag.get('href'):
                  continue
              href = a_tag['href']
              
              # Ignore comments and replies
              if 'do=findComment' in href or 'comment=' in href:
                  continue
              
              m = re.search(r'/topic/(\d+)-', href)
              if not m:
                  continue
              tid_int = int(m.group(1))
              if tid_int < 10000:
                  continue
              tid = str(tid_int)
              if tid not in discovered:
                  clean_url = clean_topic_url(href, domain)
                  raw_title = a_tag.get_text(strip=True)
                  slug_title = extract_title_from_slug(clean_url)
                  title = slug_title if (slug_title and len(slug_title) > len(raw_title)) else raw_title
                  discovered[tid] = (title, clean_url, tid_int)

          sorted_items = sorted(discovered.values(), key=lambda x: x[2], reverse=True)
          print('Clean Genuine Releases Found:', len(sorted_items))
          for t, u, tid in sorted_items:
              print(f'TID: {tid} | {t[:50]} | {u[:70]}')
          "
