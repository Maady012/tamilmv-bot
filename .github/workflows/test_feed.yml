name: Test Feed Scraper
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          python3 -c "
          from curl_cffi import requests as cffi_requests
          from bs4 import BeautifulSoup
          import re
          from poll_worker import get_active_domain, scrape_discover_feed

          domain = get_active_domain()
          print('Active domain:', domain)
          r = cffi_requests.get(f'{domain}/index.php?/discover/', impersonate='chrome120', timeout=12)
          print('Discover status:', r.status_code)
          soup = BeautifulSoup(r.text, 'html.parser')
          
          # Test discover items
          stream = soup.find('ol', class_='ipsStream') or soup
          for li in stream.find_all('li', class_='ipsStreamItem')[:15]:
              a = li.find('a', href=re.compile(r'/topic/'))
              if a:
                  print('Item link:', a['href'], '| Text:', a.get_text(strip=True)[:40])
          
          # Also test forum home / new topics
          print('--- SCRAPE DISCOVER FEED OUTPUT ---')
          items = scrape_discover_feed(domain, set())
          for t, l, tid in items[:10]:
              print(f'TID: {tid} | Title: {t[:50]} | Link: {l}')
          "
