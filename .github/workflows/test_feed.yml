name: Test Forums Home
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          python3 -c "
          from curl_cffi import requests as cffi_requests
          from bs4 import BeautifulSoup
          import re
          from poll_worker import get_active_domain

          domain = get_active_domain()
          r = cffi_requests.get(domain, impersonate='chrome120', timeout=12)
          print('Home status:', r.status_code, 'Final URL:', r.url)
          soup = BeautifulSoup(r.text, 'html.parser')
          
          # Find all topic links on home page
          topic_links = soup.find_all('a', href=re.compile(r'/forums/topic/\d+-'))
          print(f'Total topic links on home page: {len(topic_links)}')
          seen = set()
          for a in topic_links[:30]:
              href = a['href']
              text = a.get_text(strip=True)
              m = re.search(r'/topic/(\d+)-', href)
              tid = m.group(1) if m else None
              if tid not in seen:
                  seen.add(tid)
                  print(f'Home TID {tid}: {text[:50]} | {href[:80]}')
          "
