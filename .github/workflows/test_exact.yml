name: Test Exact Latest Block
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          python3 -c "
          from poll_worker import get_active_domain, scrape_discover_feed, extract_post_details, send_alert
          import sys, traceback

          domain = get_active_domain()
          print('Active domain:', domain)
          try:
              all_topics = scrape_discover_feed(domain, set())
              print('Scrape discover feed count:', len(all_topics))
              if not all_topics:
                  print('FAIL: all_topics is empty!')
              else:
                  for t_title, t_link, t_tid in all_topics:
                      dt = extract_post_details(t_link, fallback_title=t_title)
                      print('Item:', t_tid, 'Magnets count:', len(dt.get('magnets', [])) if dt else 'NO_DT')
                      if dt and dt.get('magnets'):
                          print('Will send alert for:', t_tid, t_title)
                          send_alert('565062030', t_title, t_link, dt)
                          break
          except Exception as e:
              traceback.print_exc()
          "
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TORBOX_API_KEY: ${{ secrets.TORBOX_API_KEY }}
