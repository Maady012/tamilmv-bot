name: Test Discover Feed Topics
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          python3 -c "
          from poll_worker import get_active_domain, scrape_discover_feed, extract_post_details

          domain = get_active_domain()
          items = scrape_discover_feed(domain, set())
          print('Total items from discover feed:', len(items))
          for title, link, tid in items[:6]:
              details = extract_post_details(link, fallback_title=title)
              print('---')
              print(f'TID {tid}: {title[:50]}')
              print('Magnets:', len(details.get('magnets', [])))
              print('Torrents:', details.get('torrent_files'))
          "
