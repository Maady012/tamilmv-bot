name: Test Download Attachment
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          python3 -c "
          from curl_cffi import requests as cffi_requests
          import requests

          url = 'https://www.1tamilmv.io/applications/core/interface/file/attachment.php?id=161523&key=4cd7fe27b9d2cc4ab6f0d77a63811186'
          
          # Test with curl_cffi
          r = cffi_requests.get(url, impersonate='chrome120', timeout=12)
          print('curl_cffi status:', r.status_code, 'Content-Type:', r.headers.get('content-type'), 'Len:', len(r.content))
          print('First 100 bytes:', r.content[:100])
          
          # Test with plain requests (as was done in poll_worker.py)
          try:
              r2 = requests.get(url, timeout=12)
              print('requests status:', r2.status_code, 'Content-Type:', r2.headers.get('content-type'), 'Len:', len(r2.content))
              print('Requests first 100 bytes:', r2.content[:100])
          except Exception as e:
              print('Requests err:', e)
          "
