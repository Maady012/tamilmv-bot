name: Test Bot Full Latest
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          python3 -c "
          from poll_worker import get_active_domain, scrape_discover_feed, extract_post_details

          domain = get_active_domain()
          print('Active domain:', domain)
          all_topics = scrape_discover_feed(domain, set())
          print('Total topics:', len(all_topics))
          for t_title, t_link, t_tid in all_topics:
              dt = extract_post_details(t_link, fallback_title=t_title)
              print('Checked:', t_tid, t_title[:35], 'Magnets:', len(dt.get('magnets', [])) if dt else 'NO_DT')
              if dt and dt.get('magnets'):
                  print('FOUND FIRST VALID RELEASE:', t_tid, t_title)
                  print('Magnets sample:', dt['magnets'][0]['label'])
                  break
          "
