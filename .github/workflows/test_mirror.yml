name: Test Mirror Redirect Fixed
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          python3 -c "
          from curl_cffi import requests as cffi_requests

          test_domains = [
              'https://www.1tamilmv.io',
              'https://www.1tamilmv.fi',
              'https://1tamilmv.cz',
              'https://1tamilmv.ink',
              'https://1tamilmv.org'
          ]
          for d in test_domains:
              try:
                  r = cffi_requests.get(d, impersonate='chrome120', timeout=8, allow_redirects=True, verify=False)
                  has_kw = 'tamilmv' in r.text.lower()
                  print(f'{d} -> Final URL: {r.url}, Status: {r.status_code}, Found: {has_kw}')
              except Exception as e:
                  print(f'{d} -> Err: {e}')
          "
