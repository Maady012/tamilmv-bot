name: End-to-End System Reboot & Test

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Test End to End
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TORBOX_API_KEY: ${{ secrets.TORBOX_API_KEY }}
        run: |
          python3 -c "
          import poll_worker
          print('== STEP 1: Resolving mirror ==')
          d = poll_worker.get_active_domain(force_refresh=True)
          print('Mirror:', d)
          print('== STEP 2: Scraping feed ==')
          topics = poll_worker.scrape_discover_feed(d, set())
          print('Scraped total:', len(topics))
          print('== STEP 3: Executing handle_latest_command ==')
          poll_worker.handle_latest_command('${{ secrets.TELEGRAM_CHAT_ID }}', set())
          print('== STEP 4: Success ==')
          "
