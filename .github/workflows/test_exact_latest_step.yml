name: Test Latest Step
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run Latest Step Test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import poll_worker
          cid = '${{ secrets.TELEGRAM_CHAT_ID }}'
          domain = poll_worker.get_active_domain()
          print('Active domain:', domain)
          all_topics = poll_worker.scrape_discover_feed(domain, set())
          print('Total topics:', len(all_topics))
          for idx, (t_title, t_link, t_tid) in enumerate(all_topics[:5], 1):
              print(f'Checking #{idx} {t_tid}: {t_title[:40]} -> {t_link}')
              dt = poll_worker.extract_post_details(t_link, fallback_title=t_title)
              print('  Details extracted:', bool(dt))
              if dt:
                  print('  Image:', dt.get('image'))
                  print('  Magnets:', len(dt.get('magnets', [])))
                  if dt.get('magnets'):
                      print('  Calling send_alert...')
                      poll_worker.send_alert(cid, t_title, t_link, dt)
                      print('  send_alert completed!')
                      break
          "
