name: Test Feed Raw
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          python3 -c "
          from curl_cffi import requests as cffi_requests
          from bs4 import BeautifulSoup
          from poll_worker import get_active_domain

          domain = get_active_domain()
          print('Active domain:', domain)
          u = f'{domain}/index.php?/discover/'
          r = cffi_requests.get(u, impersonate='chrome120', timeout=15)
          print('Status:', r.status_code, 'Len:', len(r.text))
          soup = BeautifulSoup(r.text, 'html.parser')
          stream = soup.find('ol', class_='ipsStream')
          print('ipsStream found:', bool(stream))
          if stream:
              items = stream.find_all('li', class_='ipsStreamItem')
              print('ipsStreamItems count:', len(items))
              for idx, li in enumerate(items[:10]):
                  a = li.find('a', href=True)
                  print(idx, a['href'] if a else 'NO A')
          "
