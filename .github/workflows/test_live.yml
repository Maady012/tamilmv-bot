name: Test Live Dispatch

on:
  workflow_dispatch:

jobs:
  test-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install curl_cffi beautifulsoup4 requests

      - name: Run Test Dispatch
        run: python test_live_dispatch.py
