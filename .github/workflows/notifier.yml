name: 1TamilMV Live Notifier

on:
  schedule:
    # 7:00 AM to 11:45 PM IST (Runs every 15 minutes between 01:30 UTC and 18:30 UTC)
    - cron: '*/15 1-18 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Live Loop Worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TORBOX_API_KEY: ${{ secrets.TORBOX_API_KEY }}
        run: python poll_worker.py

      - name: Commit State Changes
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_posts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update seen_posts.json" && git push)
