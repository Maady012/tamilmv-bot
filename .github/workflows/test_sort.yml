name: Test Sort

on:
  workflow_dispatch:

jobs:
  sort:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install curl_cffi beautifulsoup4

      - name: Run Test Sort
        run: python test_topic_date_check.py
