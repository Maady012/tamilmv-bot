name: Test Feed URL
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          python3 -c "
          from curl_cffi import requests as cffi_requests
          from bs4 import BeautifulSoup
          import re
          from poll_worker import get_active_domain

          domain = get_active_domain()
          urls = [
              f'{domain}/index.php?/discover/unread/',
              f'{domain}/index.php?/discover/content/',
              f'{domain}/index.php?/discover/6/',
              f'{domain}/index.php?/forum/2-tamil-movies/',
              f'{domain}/index.php?/forum/31-exclusive-tamil-new-movies/',
              f'{domain}/index.php?/forum/11-tamil-new-movies/'
          ]

          for u in urls:
              try:
                  r = cffi_requests.get(u, impersonate='chrome120', timeout=10)
                  print(f'{u} -> {r.status_code} ({len(r.text)} bytes)')
                  if r.status_code == 200:
                      soup = BeautifulSoup(r.text, 'html.parser')
                      topics = soup.find_all('a', href=re.compile(r'/forums/topic/\d+-'))
                      print(f'Found {len(topics)} topics in {u}')
                      for a in topics[:3]:
                          print('  ->', a['href'][:60], '|', a.get_text(strip=True)[:35])
              except Exception as e:
                  print(f'{u} -> Err: {e}')
          "
